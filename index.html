<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // If opened as an installed PWA from the wrong domain, redirect to app.scribb.net
      (function () {
        var standalone = window.matchMedia('(display-mode: standalone)').matches
          || window.navigator.standalone === true;
        var host = window.location.hostname;
        if (standalone && host !== 'app.scribb.net' && host !== 'localhost') {
          window.location.replace(
            'https://app.scribb.net'
            + window.location.pathname
            + window.location.search
            + window.location.hash
          );
        }
      })();
    </script>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Scribb" />
    <meta name="theme-color" content="#171B21" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Your organization's history, sealed and ready to prove itself." />
    <meta property="og:type"        content="website" />
    <meta property="og:site_name"   content="Scribb" />
    <meta property="og:title"       content="Scribb — A modern instrument of record" />
    <meta property="og:description" content="Blockchain-anchored bookkeeping for organizations that intend to be trusted." />
    <meta property="og:image"       content="https://app.scribb.net/icon.png" />
    <meta property="og:image:width"  content="1254" />
    <meta property="og:image:height" content="1254" />
    <meta name="twitter:card"       content="summary_large_image" />
    <title>Scribb — A modern instrument of record</title>
  </head>

</html>
